<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>Create account — Serene Mind</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Lora:ital,wght@0,400;0,600;1,400&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="tailwind-config.js"></script>
  <link rel="stylesheet" href="site.css">
</head>
<body class="font-lora text-sepia-900 min-h-screen" data-page="signup">
  <header id="siteHeader"></header>

  <main class="max-w-md mx-auto px-4 py-10">
    <div class="vintage-card vintage-border rounded-3xl p-8 space-y-6">
      <div class="text-center space-y-1">
        <h1 class="font-cinzel text-2xl font-bold">Create your account</h1>
        <p class="text-sm text-sepia-700 font-sans">Save your orders and find them again anytime.</p>
      </div>

      <div id="formMessage" class="hidden"></div>

      <form id="signupForm" class="space-y-4 font-sans text-sm" novalidate>
        <div class="grid grid-cols-2 gap-3">
          <div>
            <label for="firstName" class="block font-bold mb-1">First name</label>
            <input id="firstName" class="field" type="text" required maxlength="60" autocomplete="given-name">
          </div>
          <div>
            <label for="lastName" class="block font-bold mb-1">Last name</label>
            <input id="lastName" class="field" type="text" required maxlength="60" autocomplete="family-name">
          </div>
        </div>
        <div>
          <label for="email" class="block font-bold mb-1">E-mail</label>
          <input id="email" class="field" type="email" required autocomplete="email">
        </div>
        <div>
          <label for="password" class="block font-bold mb-1">Password <span class="font-normal text-sepia-700">(8 characters minimum)</span></label>
          <input id="password" class="field" type="password" required minlength="8" autocomplete="new-password">
        </div>
        <div>
          <label for="password2" class="block font-bold mb-1">Confirm password</label>
          <input id="password2" class="field" type="password" required minlength="8" autocomplete="new-password">
        </div>
        <button id="submitBtn" type="submit" class="btn-primary w-full">Create account</button>
      </form>

      <p class="text-center text-sm font-sans text-sepia-700">
        Already registered? <a id="loginLink" href="login.html" class="font-bold text-dustyrose-600 hover:underline">Sign in</a>
      </p>
    </div>
  </main>

  <script defer src="supabase-js.min.js"></script>
  <script defer src="supabase-client.js"></script>
  <script defer src="supabase-shop.js"></script>
  <script defer src="site-ui.js"></script>
  <script defer src="auth-pages.js"></script>
</body>
</html>
